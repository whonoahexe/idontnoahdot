# Generated by matugen — partial override of yazi's built-in theme-dark.toml/theme-light.toml.
# Only structural colors are pinned to the Material You palette; icons/filetype rules use yazi's defaults.
#:schema https://yazi-rs.github.io/schemas/theme.json

[mgr]
