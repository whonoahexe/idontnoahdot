$lock_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lock")' & pidof qs quickshell hyprlock || hyprlock
# $lock_cmd = pidof hyprlock || hyprlock
$suspend_cmd = ~/.local/bin/suspend-unless-docked

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    # Resume USB-resets the Razer mouse, wiping its OpenRGB color, so re-apply 623CEA
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lockFocus")'; sleep 2; openrgb --noautoconnect --device 'Razer Deathadder V2' --mode static --color 623CEA
    inhibit_sleep = 3
}

listener {
    timeout = 300 # 5mins
    on-timeout = loginctl lock-session
}

