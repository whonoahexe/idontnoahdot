keep-open=yes

# Rendering: modern renderer with good scaling on the RTX 3060
vo=gpu-next
profile=high-quality

# Decode on the GPU (NVDEC), falling back to CPU if a codec isn't supported
hwdec=auto-safe

# Lock playback to the monitor's refresh rate: removes judder from 24/30/60 fps
# video on the 144/160 Hz ultrawide (audio is resampled imperceptibly to match)
video-sync=display-resample

# Resume files where you left off
save-position-on-quit=yes

# Online video (needs yt-dlp): best quality up to the ultrawide's 1440p height
ytdl-format=bestvideo[height<=?1440]+bestaudio/best
