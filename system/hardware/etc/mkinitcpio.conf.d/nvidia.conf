# NVIDIA in the initramfs: the ultrawide on DP-1 hangs off the NVIDIA card and
# needs the driver from early boot. No `kms` hook: it only added size (245 -> 106 MB
# without it) on this laptop. Same as the hand-edited /etc/mkinitcpio.conf before.
MODULES=(nvidia nvidia_modeset nvidia_uvm nvidia_drm)
HOOKS=(base systemd autodetect microcode modconf keyboard sd-vconsole block filesystems fsck)
