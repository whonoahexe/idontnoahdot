# Unreal/Unity titles (It Takes Two, Phasmophobia) hammer split-lock detection
kernel.split_lock_mitigate = 0
# Steam/Proton needs this high (already default on Arch, pinned here)
vm.max_map_count = 1048576
# less aggressive background compaction/lock fairness -> fewer hitches
vm.compaction_proactiveness = 0
vm.page_lock_unfairness = 1
